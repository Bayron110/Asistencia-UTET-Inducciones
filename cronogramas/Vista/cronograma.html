<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cronogramas</title>

    <!-- Tabler icons -->
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">

    <link rel="stylesheet" href="../estilos/cronograma.css">
</head>
<body>

    <!-- Canvas del reactor -->
    <canvas id="reactorBg"></canvas>

    <div class="layout">

        <!-- HEADER -->
        <header class="top-bar">
            <div class="top-bar-left">
                <i class="ti ti-calendar-event"></i>
                <span>Cronogramas Académicos</span>
            </div>
            <div class="top-bar-right">
                <span id="reloj" class="reloj"></span>
            </div>
        </header>

        <!-- CONTENIDO -->
        <main class="contenido">
<!-- Panel estudiante -->
<div id="panelEstudiante" class="panel-estudiante oculto"></div>

            <!-- Filtros -->
            <div class="filtros">

                <button class="filtro-btn active" data-estado="TODOS">
                    <span class="filtro-dot"></span>
                    Todos
                </button>

                <button class="filtro-btn" data-estado="VIGENTE">
                    <span class="filtro-dot vigente"></span>
                    Vigentes
                </button>

                <button class="filtro-btn" data-estado="PROGRAMADO">
                    <span class="filtro-dot programado"></span>
                    Programados
                </button>

                <button class="filtro-btn" data-estado="FINALIZADO">
                    <span class="filtro-dot finalizado"></span>
                    Finalizados
                </button>

            </div>

            <!-- Contador -->
            <div class="contador-bar">
                <span id="contadorTexto" class="contador-texto">Cargando...</span>
            </div>

            <!-- Grid de cronogramas -->
            <div id="gridCronogramas" class="grid-cronogramas">

                <!-- Skeleton de carga -->
                <div class="skeleton-card"></div>
                <div class="skeleton-card"></div>
                <div class="skeleton-card"></div>

            </div>

            <!-- Vista vacía -->
            <div id="vistaVacia" class="vista-vacia oculto">
                <i class="ti ti-calendar-off"></i>
                <h3>Sin cronogramas</h3>
                <p>No hay cronogramas que coincidan con el filtro seleccionado.</p>
            </div>

        </main>

    </div>

    <!-- Modal detalle -->
    <div id="modalOverlay" class="modal-overlay oculto">
        <div class="modal">

            <button class="modal-cerrar" id="btnCerrarModal">
                <i class="ti ti-x"></i>
            </button>

            <div class="modal-header" id="modalHeader">
                <div class="modal-badge" id="modalBadge"></div>
                <h2 id="modalNombre"></h2>
                <p id="modalPeriodo"></p>
            </div>

            <div class="modal-fechas">
                <div class="modal-fecha-item">
                    <i class="ti ti-calendar-plus"></i>
                    <div>
                        <span class="modal-fecha-label">Inicio</span>
                        <span class="modal-fecha-valor" id="modalFechaInicio"></span>
                    </div>
                </div>
                <div class="modal-fecha-item">
                    <i class="ti ti-calendar-minus"></i>
                    <div>
                        <span class="modal-fecha-label">Fin</span>
                        <span class="modal-fecha-valor" id="modalFechaFin"></span>
                    </div>
                </div>
                <div class="modal-fecha-item">
                    <i class="ti ti-send"></i>
                    <div>
                        <span class="modal-fecha-label">Publicado</span>
                        <span class="modal-fecha-valor" id="modalFechaPublicacion"></span>
                    </div>
                </div>
            </div>

            <div class="modal-actividades">
                <h4>
                    <i class="ti ti-list-check"></i>
                    Actividades
                </h4>
                <div id="modalTabla"></div>
            </div>

        </div>
    </div>

    <script type="module" src="../authentificacion/mostrar-cronograma.js"></script>
</body>
</html>
